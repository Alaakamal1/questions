<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WE Schools Question Bank 🐍</title>
<style>
:root{--bg:#fffaf0;--ink:#2b2d42;--card:#fff;--ok:#9be8b5;--bad:#ffa8b0;--p:#a58bff;--y:#ffe08a;--b:#8fd3ff}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
.bg span{position:fixed;font-size:34px;opacity:.18;animation:fl 14s linear infinite;z-index:0;pointer-events:none}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#c9ecff,#e8defc);color:var(--ink);padding:10px 14px;box-shadow:0 4px 14px #0001}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.top b{font-size:17px}
.bar{height:12px;background:#ffffffaa;border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--y);border-radius:9px;transition:width .5s}
.score{background:#fff;border-radius:20px;padding:3px 12px;font-weight:700}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px}
.hero{text-align:center;padding:22px 10px}
.snake{font-size:84px;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(-6deg)}}
.hero h1{margin:6px 0;font-size:26px}
.hero p{margin:4px;opacity:.8}
.tk{background:linear-gradient(135deg,#dcd2ff,#ffd6e8);color:var(--ink);border-radius:20px;padding:14px 16px;margin:6px 0 10px;direction:ltr;text-align:left;font-weight:700;animation:pop .6s both}
.grp{display:inline-block;background:var(--y);color:#222;border-radius:14px;padding:6px 14px;margin:18px 0 6px;font-weight:700;direction:ltr;animation:pop .6s both}
.q{background:var(--card);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 6px 16px #0002;direction:ltr;text-align:left;opacity:0;transform:translateY(30px) scale(.96);transition:.6s}
.q.show{opacity:1;transform:none}
.qh{display:flex;gap:10px;align-items:flex-start}
.num{min-width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-weight:800;background:var(--c,var(--p));box-shadow:0 3px 0 #0003}
.qt{font-size:17px;font-weight:600;line-height:1.5;padding-top:7px;white-space:pre-wrap}
.ic{margin-left:auto;font-size:28px;animation:bob 3s infinite}
.opts{display:grid;gap:8px;margin-top:12px}
.opt,.tf button,.rv{font:inherit;font-size:16px;border:3px solid transparent;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;background:var(--bg);color:var(--ink);transition:.2s;direction:ltr}
.opt:hover,.tf button:hover{transform:scale(1.03);border-color:var(--b)}
.opt b{display:inline-block;width:28px;height:28px;border-radius:50%;background:var(--b);color:var(--ink);text-align:center;line-height:28px;margin-right:8px}
.opt.ok,.tf button.ok{background:var(--ok);color:var(--ink);animation:jump .5s}
.opt.no,.tf button.no{background:var(--bad);color:var(--ink);animation:shake .4s}
.done{pointer-events:none}
.tf{display:flex;gap:10px;margin-top:12px}
.tf button{flex:1;text-align:center;font-size:20px;font-weight:800}
.rv{margin-top:12px;background:var(--y);color:#222;font-weight:700;text-align:center;width:100%}
.ans{white-space:pre-wrap;direction:ltr;text-align:left;margin-top:10px;padding:10px 14px;border-radius:14px;background:#9be8b566;font-weight:700;font-size:16px;display:none;animation:pop .5s}
.ans.on{display:block}
.fb{margin-top:8px;font-weight:700;min-height:22px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes jump{40%{transform:translateY(-10px) scale(1.05)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px;margin:10px 0}
.tab{font:inherit;font-weight:700;border:0;border-radius:16px;padding:9px 16px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #0001;transition:.2s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--y);transform:translateY(-3px);box-shadow:0 5px 0 #0002}
.tabs.sub .tab{font-size:14px;padding:6px 12px;background:#e6f6ff}
.tabs.sub .tab.on{background:#c9ecff}
.tab small{opacity:.6;font-weight:600;font-size:.82em}
.panel,.gp{animation:pop .4s both}
.end{text-align:center;padding:30px;font-size:20px}
.cf{position:fixed;top:-20px;font-size:24px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style>
</head>

,{t:"Group (6): Answer the following questions",ty:"fill",q:[
 [161,'Write the steps to install Python and get ready to code.','1. Go to the official Python website (python.org).\n2. Download the latest Python version for your operating system.\n3. Run the installer and tick "Add Python to PATH".\n4. Click Install Now and wait until the installation finishes.\n5. Install an IDE such as VS Code and run it.\n6. Install the Python extension in VS Code.\n7. Make a file hello.py, type print("Hello from VS Code!"), save it and run it to test.'],
 [162,'How do you set up Python in VS Code? Include the steps to install the Python extension.','1. Open VS Code.\n2. Click the Extensions icon on the left side (or press Ctrl+Shift+X).\n3. Type "Python" in the search box and choose the Python extension.\n4. Click Install.\n5. Make a new file (File > New File) and save it with the .py ending.\n6. Run it with "Run Python File in Terminal" or the Run button.'],
 [163,'Write four tools that we use to write and run Python programs. Give one feature of each.','Any four of:\nIDLE: the default editor that comes with Python.\nVS Code: syntax highlighting, code completion and debugging.\nCommand Line / Terminal: runs Python programs by typing commands.\nPyCharm Community Edition: an IDE with advanced tools for coding, testing and debugging.\nJupyter Notebook: code, text and visualizations in one document.\nGoogle Colab: runs Python in a web browser without installing Python.'],
 [164,'What is defensive programming? Why is it important?','Defensive programming means we expect errors and wrong input, and we handle them.\nIt is important because a user may type text, leave the input empty or type an impossible value. The program must stay stable and not crash.'],
 [165,'What does a try-except block do? How does it help make safe programs?','The try block has the code that may cause an error. The except block runs if an error happens. So the program does not crash, it can show a helpful message, and it can ask the user again.'],
 [166,'How does a while True loop with break make a menu program?','The loop keeps the program running and shows the menu again after each job. The program stops only when the user chooses Exit, which runs break. A wrong choice goes to the else part, which asks the user to try again.'],
 [167,'What are the math and random modules used for in this unit? Give an example of each.','math: has ready tools for math work. Example: math.ceil(average) rounds a number up.\nrandom: has ready tools for random work. Example: random.choice(student_list) picks one random item from a list.'],
 [168,'Why do we use a function for each job (such as add and view) in a menu program?','A function does one job and can be used again and again. It breaks the big program into small parts. The program is easier to read and fix, and it has less repeated code.']
 ]},
 {t:"Group (7): Write what each program prints.",ty:"fill",q:[
 [169,'What is the output of this code?\nregistered_ids = {1001, 1002, 1003}\ndef add_student_id(new_id):\n    if new_id in registered_ids:\n        print("Error: ID", new_id, "exists!")\n    else:\n        registered_ids.add(new_id)\n        print("Added:", new_id)\nadd_student_id(1004)\nadd_student_id(1001)\nprint(len(registered_ids))','Output:\nAdded: 1004\nError: ID 1001 exists!\n4\nThe ID 1001 is already in the set, so it is not added. The set has 4 IDs.'],
 [170,'What is the output of this code?\nimport math\ngrades = [85, 92, 78, 88]\naverage = sum(grades) / len(grades)\nfinal_score = math.ceil(average)\nprint("Average:", average)\nprint("Final score:", final_score)','Output:\nAverage: 85.75\nFinal score: 86'],
 [171,'What is the output of this code?\nimport math\ngrades = [85, 90, 82]\naverage = sum(grades) / len(grades)\nprint(f"Raw Average: {average:.2f}")\nprint(f"Official Final Score: {math.ceil(average)}")','Output:\nRaw Average: 85.67\nOfficial Final Score: 86\n:.2f shows 2 numbers after the decimal point.'],
 [172,'What is the output of this code?\nchoice = "3"\nif choice == "1":\n    print("Adding...")\nelif choice == "2":\n    print("Viewing...")\nelif choice == "3":\n    print("Goodbye!")\nelse:\n    print("Invalid choice")','Output:\nGoodbye!'],
 [173,'What is the output of this code?\nchoices = ["1", "9", "3"]\nfor choice in choices:\n    if choice == "1":\n        print("Adding...")\n    elif choice == "3":\n        print("Goodbye!")\n        break\n    else:\n        print("Invalid choice")','Output:\nAdding...\nInvalid choice\nGoodbye!'],
 [174,'What is the output of this code?\nclass_list = []\nif len(class_list) == 0:\n    print("System Alert: No students available in the list.")\nelse:\n    print("Pick a winner")','Output:\nSystem Alert: No students available in the list.\nThe list is empty, so len(class_list) is 0.'],

 [176,'What is the output of this code?\ngrade = 150\nwhile grade < 0 or grade > 100:\n    print("Grade must be from 0 to 100")\n    grade = 85\nprint("Grade recorded:", grade)','Output:\nGrade must be from 0 to 100\nGrade recorded: 85']
 ]},
 {t:"Group (8): Each program has a problem. Explain the problem and write a better version.",ty:"fill",q:[
 [177,'The program accepts any grade, even 500. The grade must be from 0 to 100.\ngrade = int(input("Grade: "))\nprint("Grade recorded:", grade)','Problem: the program does not check the grade, so a wrong grade like 500 is accepted.\nBetter code:\ngrade = int(input("Grade: "))\nwhile grade < 0 or grade > 100:\n    print("Grade must be from 0 to 100")\n    grade = int(input("Grade: "))\nprint("Grade recorded:", grade)'],
 [178,'The menu never stops, even when the user chooses 3.\nwhile True:\n    choice = input("1. Add  2. View  3. Exit: ")\n    if choice == "1":\n        print("Adding...")\n    elif choice == "2":\n        print("Viewing...")\n    elif choice == "3":\n        print("Goodbye!")\n    else:\n        print("Invalid choice")','Problem: the Exit choice has no break, so the loop never stops.\nBetter code:\nwhile True:\n    choice = input("1. Add  2. View  3. Exit: ")\n    if choice == "1":\n        print("Adding...")\n    elif choice == "2":\n        print("Viewing...")\n    elif choice == "3":\n        print("Goodbye!")\n        break\n    else:\n        print("Invalid choice")'],
 [179,'The registry accepts the same ID twice.\nids = [1001, 1002]\nids.append(1001)\nprint(ids)','Problem: a list allows the same ID twice, and the program does not check if the ID is already there.\nBetter code (a set with a check):\nids = {1001, 1002}\nnew_id = 1001\nif new_id in ids:\n    print("Error: ID already registered!")\nelse:\n    ids.add(new_id)'],
 [180,'The program crashes when the class list is empty.\nimport random\nclass_list = []\nwinner = random.choice(class_list)\nprint("Winner:", winner)','Problem: random.choice() cannot pick from an empty list (IndexError).\nBetter code:\nimport random\nclass_list = []\nif len(class_list) == 0:\n    print("No students available in the list.")\nelse:\n    winner = random.choice(class_list)\n    print("Winner:", winner)'],
 [181,'The menu does not work. When the user types 1, nothing is added.\nchoice = input("Select an option: ")\nif choice == 1:\n    print("Adding...")\nelse:\n    print("Invalid choice")','Problem: input() gives text, so choice is the text "1". Text is never equal to the number 1.\nBetter code:\nchoice = input("Select an option: ")\nif choice == "1":\n    print("Adding...")\nelse:\n    print("Invalid choice")'],
 [182,'The report shows a very long number such as 85.66666666666667. It should show 2 numbers after the decimal point.\ngrades = [85, 90, 82]\naverage = sum(grades) / len(grades)\nprint("Average:", average)','Problem: the average is printed as it is, with all its decimals.\nBetter code:\ngrades = [85, 90, 82]\naverage = sum(grades) / len(grades)\nprint(f"Average: {average:.2f}")'],
 [183,'The program crashes when the user types text instead of a grade.\ngrade = int(input("Grade: "))\nprint("Grade recorded:", grade)','Problem: int() cannot change text into a number, so a ValueError stops the program. The input is not protected.\nBetter code:\ntry:\n    grade = int(input("Grade: "))\n    print("Grade recorded:", grade)\nexcept ValueError:\n    print("Type error: Please enter a valid whole number.")'],
 [184,'The program must stop when the user types exit, but it never stops.\nwhile True:\n    text = input("Type exit to stop: ")\n    print("You typed:", text)','Problem: the loop has no break, so it has no way out.\nBetter code:\nwhile True:\n    text = input("Type exit to stop: ")\n    if text == "exit":\n        break\n    print("You typed:", text)']
 ]}

 {t:"Group (10): Write a Python program or function for each task.",ty:"fill",q:[
 [193,'Write a function get_valid_grade() that keeps asking until the user types a grade from 0 to 100. Then it gives the grade back.','def get_valid_grade():\n    grade = int(input("Grade: "))\n    while grade < 0 or grade > 100:\n        print("Grade must be from 0 to 100.")\n        grade = int(input("Grade: "))\n    return grade\n\nprint(get_valid_grade())'],
 [194,'Write a function add_student_id(new_id) that adds an ID to the set registered_ids only if it is not there already. It prints a message.','registered_ids = {1001, 1002, 1003}\n\ndef add_student_id(new_id):\n    if new_id in registered_ids:\n        print("Error: ID", new_id, "exists!")\n    else:\n        registered_ids.add(new_id)\n        print("Added:", new_id)\n\nadd_student_id(1004)'],

 [196,'Write a menu program using while True. It shows: 1. Add Data, 2. View All, 3. Exit. It prints a different message for each choice and an error message for any other choice. It stops when the user chooses 3.','while True:\n    print("1. Add Data | 2. View All | 3. Exit")\n    choice = input("Select an option (1-3): ")\n    if choice == "1":\n        print("Adding data...")\n    elif choice == "2":\n        print("Displaying all records...")\n    elif choice == "3":\n        print("Exiting. Goodbye!")\n        break\n    else:\n        print("Invalid choice, please try again.")'],

 [198,'Write a function select_winner(student_list). If the list is empty, it prints "System Alert: No students available in the list." and gives back None. Otherwise it picks a random item, prints it and gives it back.','import random\n\ndef select_winner(student_list):\n    if len(student_list) == 0:\n        print("System Alert: No students available in the list.")\n        return None\n    winner = random.choice(student_list)\n    print("The winner for this week is:", winner)\n    return winner\n\nselect_winner(["a", "b", "c"])'],

var app=document.getElementById('app'),total=0,done=0,score=0;

function build(card,g,q){

 }else if(g.ty==='tf'){

 }else{

 }
 card.appendChild(fb)
}
